name: Feature request
description: Propose an improvement to the self-hosted delegation workflow.
title: "[Feature] "
body:
  - type: textarea
    id: outcome
    attributes:
      label: What are you trying to accomplish?
      description: Describe the caller's or operator's problem and a concrete example.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Include alternatives and constraints, if useful.
    validations:
      required: true
