name: Portable caller and service checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  caller:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "pytest>=8,<10"
      - run: python -m pytest tests/test_skill_installer.py tests/test_agent_onboarding.py -q
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]' -r integrations/omarchy-mcp/requirements.lock
      - run: python -m pytest tests/mcp tests/test_host_installer.py tests/test_portable_operator_credentials.py tests/test_legacy_archive.py -q
