[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudworkbench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
backup = ["cryptography>=45,<51"]

[project.scripts]
cloud2 = "cloudworkbench.cli:main"
cloud-compat = "cloudworkbench.compat:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cloudworkbench = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
